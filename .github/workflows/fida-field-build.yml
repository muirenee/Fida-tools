name: Fida Field Test Build

on:
  push:
    branches: [ fida-field-dev ]
    paths:
      - '.fida-build/**'
      - '.fida-patches/**'
      - '.fida-signing/**'
      - '.fida-branding/**'
      - '.github/workflows/fida-field-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fida-field-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Fida Field source
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-build/part*.b64 | tr -d '\n' | base64 -d > fida-field-project.zip
          unzip -q fida-field-project.zip
          test -f fida-field/app/build.gradle

      - name: Apply Fida Field 0.9.1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-patches/0.9.1.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/fida-0.9.1.patch
          patch -p1 < /tmp/fida-0.9.1.patch

      - name: Apply Fida Field 0.9.2 roadmap patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-patches/0.9.2.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/fida-0.9.2.patch
          patch -p1 < /tmp/fida-0.9.2.patch

      - name: Apply Fida Field 0.9.3 roadmap patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-patches/0.9.3.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/fida-0.9.3.patch
          patch -p1 < /tmp/fida-0.9.3.patch

      - name: Apply Fida Field 0.9.4 signing patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-patches/0.9.4.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/fida-0.9.4.patch
          patch -p1 < /tmp/fida-0.9.4.patch

      - name: Apply Fida Field 0.9.5 commercial-foundation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-patches/0.9.5.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/fida-0.9.5.patch
          patch -p1 < /tmp/fida-0.9.5.patch

      - name: Apply Fida Field 0.9.6 UI and branding patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-patches/0.9.6.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/fida-0.9.6.patch
          patch -p1 < /tmp/fida-0.9.6.patch

      - name: Fix Fida Field 0.9.6 Material theme resources
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/<item name="colorBackground">/d; /<item name="colorOnBackground">/d' fida-field/app/src/main/res/values/themes.xml
          sed -i '/<item name="colorBackground">/d; /<item name="colorOnBackground">/d' fida-field/app/src/main/res/values-night/themes.xml

      - name: Apply Fida Field 0.9.7 Pro custom branding patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-patches/0.9.7.part* | tr -d '\n' | base64 -d > /tmp/fida-0.9.7.patch.gz
          echo '8ccb6ccf415df03a2367fd4e507c875fc9b05612876bcf08afb1526378455b32  /tmp/fida-0.9.7.patch.gz' | sha256sum -c -
          gzip -d -c /tmp/fida-0.9.7.patch.gz > /tmp/fida-0.9.7.patch
          echo '53e4cad7d114233ec93427b2aabfbb2b1212b01c376509b07c4eb01d08f09359  /tmp/fida-0.9.7.patch' | sha256sum -c -
          patch -p1 < /tmp/fida-0.9.7.patch

      - name: Apply Fida Field 0.9.7.1 branding visibility hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          java = Path('fida-field/app/src/main/java/com/fidalix/fidafield/MainActivity.java')
          s = java.read_text()
          anchor = '        b.addView(menuCard("Plan & subscription",entitlements.planName()+" • "+entitlements.usageSummary(),v->showPlan()));'
          addition = anchor + '\n        b.addView(menuCard("Custom branding · Pro",entitlements.isPro()?(branding.isActive()?"Active custom company identity":"Logo, colors and branded PDFs"):"Subscriber feature · upgrade to unlock",v->{if(entitlements.canUseCustomBranding())showBranding();else showUpgradeRequired("Custom branding");}));'
          assert anchor in s, 'Plan menu anchor not found'
          s = s.replace(anchor, addition, 1)
          s = s.replace('Fida Field 0.9.6 Test\\nA polished, offline-first field service and maintenance manager by Fidalix.', 'Fida Field 0.9.7.1 Test\\nA polished, offline-first field service and maintenance manager by Fidalix.', 1)
          java.write_text(s)

          gradle = Path('fida-field/app/build.gradle')
          g = gradle.read_text()
          assert "versionCode 8" in g and "versionName '0.9.7-test'" in g, '0.9.7 version markers not found'
          g = g.replace('versionCode 8', 'versionCode 9', 1).replace("versionName '0.9.7-test'", "versionName '0.9.7.1-test'", 1)
          gradle.write_text(g)
          PY
          grep -q 'Custom branding · Pro' fida-field/app/src/main/java/com/fidalix/fidafield/MainActivity.java
          grep -q "versionName '0.9.7.1-test'" fida-field/app/build.gradle

      - name: Restore supplied Fidalix logo asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fida-field/app/src/main/res/drawable-nodpi
          tr -d '\n' < .fida-branding/fidalix-logo.b64 | base64 -d > fida-field/app/src/main/res/drawable-nodpi/fidalix_logo.png
          echo '01a062580380653646b4047d4f975156e7bef5a120439f43c844600d774bb5c9  fida-field/app/src/main/res/drawable-nodpi/fidalix_logo.png' | sha256sum -c -

      - name: Reconstruct persistent test signing key
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-signing/fida-field-test.part* | tr -d '\n' | base64 -d > fida-field/app/fida-test.keystore
          echo 'd407757a25505be46048d30b3b19b85a4abb9b0bf14475b2368e0f2e7e9bac51  fida-field/app/fida-test.keystore' | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build installable test APK
        working-directory: fida-field
        run: gradle :app:assembleDebug --stacktrace

      - name: Package reconstructed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -f fida-field/app/fida-test.keystore
          zip -qr Fida-Field-0.9.7.1-source-snapshot.zip fida-field -x 'fida-field/.gradle/*' 'fida-field/app/build/*'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fida-Field-0.9.7.1-test-apk
          path: fida-field/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Fida-Field-0.9.7.1-source-snapshot
          path: Fida-Field-0.9.7.1-source-snapshot.zip
          retention-days: 2
          if-no-files-found: error
