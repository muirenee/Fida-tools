name: Fida Field 0.9.13 Unified People and Workspace Plan

on:
  push:
    branches: [ fida-field-dev ]
    paths:
      - '.github/workflows/fida-field-0913.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fida-field-0913-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout normalized 0.9.12 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.9.13 unified people and workspace plan
        shell: bash
        run: |
          set -euo pipefail
          python3 .fida-build/fix_apply_0913.py
          python3 .fida-build/apply_0913.py
          grep -q "versionName '0.9.13-test'" fida-field/app/build.gradle
          grep -q "versionCode 16" fida-field/app/build.gradle
          grep -q 'DB_VERSION = 8' fida-field/app/src/main/java/com/fidalix/fidafield/AppDatabase.java
          grep -q 'user_uuid TEXT' fida-field/app/src/main/java/com/fidalix/fidafield/AppDatabase.java
          grep -q 'autoLinkPeople' fida-field/app/src/main/java/com/fidalix/fidafield/AppDatabase.java
          grep -q 'One person · job assignment · app access' fida-field/app/src/main/java/com/fidalix/fidafield/MainActivity.java
          grep -q 'workspace_billing_entitlements' fida-field/app/src/main/java/com/fidalix/fidafield/BillingManager.java
          grep -q 'workspace_id' fida-field/app/src/main/java/com/fidalix/fidafield/BillingManager.java

      - name: Verify Supabase build configuration
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PUBLISHABLE_KEY:-}"
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) echo 'Supabase publishable key is configured' ;;
            *) echo 'SUPABASE_PUBLISHABLE_KEY is missing or has the wrong key type' >&2; exit 1 ;;
          esac

      - name: Reconstruct persistent test signing key
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-signing/fida-field-test.part* | tr -d '\n' | base64 -d > fida-field/app/fida-test.keystore
          echo 'd407757a25505be46048d30b3b19b85a4abb9b0bf14475b2368e0f2e7e9bac51  fida-field/app/fida-test.keystore' | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1); fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Play edition
        working-directory: fida-field
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          gradle clean :app:assembleDebug -PFIDA_OPEN_EDITION=false --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Fida-Field-0.9.13-play-test.apk

      - name: Build Fidalix Open edition
        working-directory: fida-field
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          gradle clean :app:assembleDebug -PFIDA_OPEN_EDITION=true --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Fida-Field-0.9.13-open-test.apk

      - name: Upload 0.9.13 APKs
        uses: actions/upload-artifact@v4
        with:
          name: Fida-Field-0.9.13-test-apks
          path: |
            /tmp/Fida-Field-0.9.13-play-test.apk
            /tmp/Fida-Field-0.9.13-open-test.apk
          retention-days: 7
          if-no-files-found: error

      - name: Commit normalized 0.9.13 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f fida-field/app/fida-test.keystore .fida-build/apply_0913.py .fida-build/fix_apply_0913.py
          git config user.name 'Fida Field CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A fida-field .fida-build/apply_0913.py .fida-build/fix_apply_0913.py
          git commit -m 'Fida Field 0.9.13 unified people and workspace billing'
          git push origin HEAD:fida-field-dev
