name: Fida Field 1.0.1 Hotfix Build v2

on:
  push:
    branches: [ fida-field-dev ]
    paths:
      - '.github/workflows/fida-field-101-build-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Apply 1.0.1 hotfix
        run: python3 .github/scripts/fida_field_101_about_version_hotfix.py

      - name: Verify source
        run: |
          set -euo pipefail
          grep -q 'versionCode 54' fida-field/app/build.gradle
          grep -q "versionName '1.0.1'" fida-field/app/build.gradle
          grep -q 'BuildConfig.VERSION_NAME' fida-field/app/src/main/java/com/fidalix/fidafield/MainActivity.java
          ! grep -q 'Fida Field 0.9.33 Test' fida-field/app/src/main/java/com/fidalix/fidafield/MainActivity.java

      - name: Reconstruct signing keystore
        run: |
          set -euo pipefail
          cat .fida-signing/fida-field-test.part* | tr -d '\n' | base64 -d > fida-field/app/fida-test.keystore
          echo 'd407757a25505be46048d30b3b19b85a4abb9b0bf14475b2368e0f2e7e9bac51  fida-field/app/fida-test.keystore' | sha256sum -c -

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install API 36
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1); fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Lint and unit test
        working-directory: fida-field
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          gradle :app:lintDebug -PFIDA_OPEN_EDITION=true --stacktrace
          gradle :app:testDebugUnitTest -PFIDA_OPEN_EDITION=true --stacktrace

      - name: Build Open APK
        working-directory: fida-field
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          gradle :app:assembleDebug -PFIDA_OPEN_EDITION=true --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Fida-Field-1.0.1-open.apk
          unzip -t /tmp/Fida-Field-1.0.1-open.apk >/dev/null
          sha256sum /tmp/Fida-Field-1.0.1-open.apk > /tmp/apk.sha256

      - name: Enable release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fida-field/app/build.gradle')
          s=p.read_text()
          old='        release {\n            minifyEnabled false\n'
          new='        release {\n            signingConfig signingConfigs.test\n            minifyEnabled false\n'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY

      - name: Build Play AAB
        working-directory: fida-field
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          gradle :app:bundleRelease -PFIDA_OPEN_EDITION=false --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab /tmp/Fida-Field-1.0.1-play-release.aab
          unzip -t /tmp/Fida-Field-1.0.1-play-release.aab >/dev/null
          jarsigner -verify /tmp/Fida-Field-1.0.1-play-release.aab
          sha256sum /tmp/Fida-Field-1.0.1-play-release.aab > /tmp/aab.sha256

      - name: Validation report
        run: |
          {
            echo 'Fida Field 1.0.1 hotfix validation'
            echo 'Version code: 54'
            echo 'Version name: 1.0.1'
            echo 'About version source: BuildConfig.VERSION_NAME'
            echo 'Legacy Test label: removed'
            echo 'Lint: PASS'
            echo 'Unit-test task: PASS'
            cat /tmp/apk.sha256
            cat /tmp/aab.sha256
          } > /tmp/Fida-Field-1.0.1-validation.txt

      - name: Normalize source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fida-field/app/build.gradle')
          s=p.read_text().replace('        release {\n            signingConfig signingConfigs.test\n            minifyEnabled false\n','        release {\n            minifyEnabled false\n',1)
          p.write_text(s)
          PY
          rm -f fida-field/app/fida-test.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: Fida-Field-1.0.1-open-apk
          path: /tmp/Fida-Field-1.0.1-open.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Fida-Field-1.0.1-play-release-aab
          path: /tmp/Fida-Field-1.0.1-play-release.aab
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Fida-Field-1.0.1-validation
          path: /tmp/Fida-Field-1.0.1-validation.txt
          retention-days: 30

      - name: Commit normalized source
        run: |
          set -euo pipefail
          git config user.name 'Fida Field CI'
          git config user.email 'actions@users.noreply.github.com'
          git add fida-field
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fida Field 1.0.1 About/version hotfix'
          git fetch origin fida-field-dev
          git rebase origin/fida-field-dev
          git push origin HEAD:fida-field-dev
