name: Fida Field 0.9.9 Live Supabase Sync

on:
  push:
    branches: [ fida-field-dev ]
    paths:
      - '.github/workflows/fida-field-099.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fida-field-099-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout normalized source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.9.9 source integration
        shell: bash
        run: |
          set -euo pipefail
          python3 .fida-build/apply_099.py
          grep -q 'DB_VERSION = 5' fida-field/app/src/main/java/com/fidalix/fidafield/AppDatabase.java
          grep -q "versionName '0.9.9-test'" fida-field/app/build.gradle
          grep -q 'Sync now' fida-field/app/src/main/java/com/fidalix/fidafield/MainActivity.java

      - name: Verify Supabase build configuration
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PUBLISHABLE_KEY:-}"
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) echo 'Supabase publishable key is configured' ;;
            *) echo 'SUPABASE_PUBLISHABLE_KEY is missing or has the wrong key type' >&2; exit 1 ;;
          esac

      - name: Reconstruct persistent test signing key
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-signing/fida-field-test.part* | tr -d '\n' | base64 -d > fida-field/app/fida-test.keystore
          echo 'd407757a25505be46048d30b3b19b85a4abb9b0bf14475b2368e0f2e7e9bac51  fida-field/app/fida-test.keystore' | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1); fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build signed 0.9.9 APK
        working-directory: fida-field
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload 0.9.9 APK
        uses: actions/upload-artifact@v4
        with:
          name: Fida-Field-0.9.9-test-apk
          path: fida-field/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Commit normalized 0.9.9 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f fida-field/app/fida-test.keystore .fida-build/apply_099.py
          git config user.name 'Fida Field CI'
          git config user.email 'actions@users.noreply.github.com'
          git add fida-field .fida-build/apply_099.py
          git commit -m 'Fida Field 0.9.9 live Supabase account and core sync'
          git push origin HEAD:fida-field-dev
