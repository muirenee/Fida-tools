name: Fida Field Play AAB

on:
  push:
    branches: [ fida-field-dev ]
    paths:
      - '.github/workflows/fida-field-play-aab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fida-field-play-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Supabase build configuration
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PUBLISHABLE_KEY:-}"
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) echo 'Supabase publishable key is configured' ;;
            *) echo 'SUPABASE_PUBLISHABLE_KEY is missing or has the wrong key type' >&2; exit 1 ;;
          esac

      - name: Reconstruct persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-signing/fida-field-test.part* | tr -d '\n' | base64 -d > fida-field/app/fida-test.keystore
          echo 'd407757a25505be46048d30b3b19b85a4abb9b0bf14475b2368e0f2e7e9bac51  fida-field/app/fida-test.keystore' | sha256sum -c -

      - name: Configure signed release bundle
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^[[:space:]]*release[[:space:]]*{/a\            signingConfig signingConfigs.test' fida-field/app/build.gradle
          grep -q "applicationId 'com.fidalix.fidafield'" fida-field/app/build.gradle
          grep -q "versionCode 16" fida-field/app/build.gradle
          grep -q "versionName '0.9.13-test'" fida-field/app/build.gradle
          grep -q 'signingConfig signingConfigs.test' fida-field/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1); fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build signed Play release AAB
        working-directory: fida-field
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          gradle clean :app:bundleRelease -PFIDA_OPEN_EDITION=false --stacktrace
          test -f app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/bundle/release/app-release.aab /tmp/Fida-Field-0.9.13-play-release.aab
          sha256sum /tmp/Fida-Field-0.9.13-play-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Fida-Field-0.9.13-play-release-aab
          path: /tmp/Fida-Field-0.9.13-play-release.aab
          retention-days: 14
          if-no-files-found: error
