name: Fida Field Test Build

on:
  push:
    branches: [ fida-field-dev ]
    paths:
      - '.fida-build/**'
      - '.fida-patches/**'
      - '.fida-signing/**'
      - '.fida-branding/**'
      - '.github/workflows/fida-field-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fida-field-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Fida Field source
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-build/part*.b64 | tr -d '\n' | base64 -d > fida-field-project.zip
          unzip -q fida-field-project.zip
          test -f fida-field/app/build.gradle

      - name: Apply Fida Field 0.9.1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-patches/0.9.1.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/fida-0.9.1.patch
          patch -p1 < /tmp/fida-0.9.1.patch
          grep -q "versionName '0.9.1-test'" fida-field/app/build.gradle

      - name: Apply Fida Field 0.9.2 roadmap patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-patches/0.9.2.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/fida-0.9.2.patch
          patch -p1 < /tmp/fida-0.9.2.patch
          grep -q "versionName '0.9.2-test'" fida-field/app/build.gradle

      - name: Apply Fida Field 0.9.3 roadmap patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-patches/0.9.3.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/fida-0.9.3.patch
          patch -p1 < /tmp/fida-0.9.3.patch
          grep -q "versionName '0.9.3-test'" fida-field/app/build.gradle

      - name: Apply Fida Field 0.9.4 signing patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-patches/0.9.4.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/fida-0.9.4.patch
          patch -p1 < /tmp/fida-0.9.4.patch
          grep -q "versionName '0.9.4-test'" fida-field/app/build.gradle

      - name: Apply Fida Field 0.9.5 commercial-foundation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-patches/0.9.5.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/fida-0.9.5.patch
          patch -p1 < /tmp/fida-0.9.5.patch
          grep -q "versionName '0.9.5-test'" fida-field/app/build.gradle

      - name: Apply Fida Field 0.9.6 UI and branding patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-patches/0.9.6.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/fida-0.9.6.patch
          patch -p1 < /tmp/fida-0.9.6.patch
          grep -q "versionName '0.9.6-test'" fida-field/app/build.gradle

      - name: Fix Fida Field 0.9.6 Material theme resources
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/<item name="colorBackground">/d; /<item name="colorOnBackground">/d' fida-field/app/src/main/res/values/themes.xml
          sed -i '/<item name="colorBackground">/d; /<item name="colorOnBackground">/d' fida-field/app/src/main/res/values-night/themes.xml
          ! grep -q 'name="colorBackground"' fida-field/app/src/main/res/values/themes.xml
          ! grep -q 'name="colorBackground"' fida-field/app/src/main/res/values-night/themes.xml

      - name: Restore supplied Fidalix logo asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fida-field/app/src/main/res/drawable-nodpi
          tr -d '\n' < .fida-branding/fidalix-logo.b64 | base64 -d > fida-field/app/src/main/res/drawable-nodpi/fidalix_logo.png
          echo '01a062580380653646b4047d4f975156e7bef5a120439f43c844600d774bb5c9  fida-field/app/src/main/res/drawable-nodpi/fidalix_logo.png' | sha256sum -c -

      - name: Reconstruct persistent test signing key
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-signing/fida-field-test.part* | tr -d '\n' | base64 -d > fida-field/app/fida-test.keystore
          echo 'd407757a25505be46048d30b3b19b85a4abb9b0bf14475b2368e0f2e7e9bac51  fida-field/app/fida-test.keystore' | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build installable test APK
        working-directory: fida-field
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fida-Field-0.9.6-test-apk
          path: fida-field/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
