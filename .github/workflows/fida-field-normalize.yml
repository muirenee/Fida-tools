name: Normalize Fida Field Source

on:
  push:
    branches: [ fida-field-dev ]
    paths:
      - '.github/workflows/fida-field-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Fida Field 0.9.7.1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fida-field
          cat .fida-build/part*.b64 | tr -d '\n' | base64 -d > /tmp/fida-field-project.zip
          unzip -q /tmp/fida-field-project.zip
          for v in 0.9.1 0.9.2 0.9.3 0.9.4 0.9.5 0.9.6; do
            cat .fida-patches/${v}.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/${v}.patch
            patch -p1 < /tmp/${v}.patch >/dev/null
          done
          sed -i '/<item name="colorBackground">/d; /<item name="colorOnBackground">/d' fida-field/app/src/main/res/values/themes.xml
          sed -i '/<item name="colorBackground">/d; /<item name="colorOnBackground">/d' fida-field/app/src/main/res/values-night/themes.xml
          cat .fida-patches/0.9.7.part* | tr -d '\n' | base64 -d > /tmp/0.9.7.patch.gz
          echo '8ccb6ccf415df03a2367fd4e507c875fc9b05612876bcf08afb1526378455b32  /tmp/0.9.7.patch.gz' | sha256sum -c -
          gzip -d -c /tmp/0.9.7.patch.gz > /tmp/0.9.7.patch
          patch -p1 < /tmp/0.9.7.patch >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          java = Path('fida-field/app/src/main/java/com/fidalix/fidafield/MainActivity.java')
          s = java.read_text()
          anchor = '        b.addView(menuCard("Plan & subscription",entitlements.planName()+" • "+entitlements.usageSummary(),v->showPlan()));'
          addition = anchor + '\n        b.addView(menuCard("Custom branding · Pro",entitlements.isPro()?(branding.isActive()?"Active custom company identity":"Logo, colors and branded PDFs"):"Subscriber feature · upgrade to unlock",v->{if(entitlements.canUseCustomBranding())showBranding();else showUpgradeRequired("Custom branding");}));'
          assert anchor in s
          s = s.replace(anchor, addition, 1)
          s = s.replace('Fida Field 0.9.6 Test\\nA polished, offline-first field service and maintenance manager by Fidalix.', 'Fida Field 0.9.7.1 Test\\nA polished, offline-first field service and maintenance manager by Fidalix.', 1)
          java.write_text(s)
          gradle = Path('fida-field/app/build.gradle')
          g = gradle.read_text()
          assert "versionCode 8" in g and "versionName '0.9.7-test'" in g
          g = g.replace('versionCode 8','versionCode 9',1).replace("versionName '0.9.7-test'","versionName '0.9.7.1-test'",1)
          gradle.write_text(g)
          PY
          mkdir -p fida-field/app/src/main/res/drawable-nodpi
          tr -d '\n' < .fida-branding/fidalix-logo.b64 | base64 -d > fida-field/app/src/main/res/drawable-nodpi/fidalix_logo.png
          echo '01a062580380653646b4047d4f975156e7bef5a120439f43c844600d774bb5c9  fida-field/app/src/main/res/drawable-nodpi/fidalix_logo.png' | sha256sum -c -
          rm -f fida-field/app/fida-test.keystore
          printf '\n*.keystore\n' >> fida-field/.gitignore
          grep -q 'Custom branding · Pro' fida-field/app/src/main/java/com/fidalix/fidafield/MainActivity.java
          grep -q "versionName '0.9.7.1-test'" fida-field/app/build.gradle

      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fida Field CI'
          git config user.email 'actions@users.noreply.github.com'
          git add fida-field
          if git diff --cached --quiet; then
            echo 'Normalized source already committed.'
            exit 0
          fi
          git commit -m 'Normalize Fida Field 0.9.7.1 Android source'
          git push origin HEAD:fida-field-dev
