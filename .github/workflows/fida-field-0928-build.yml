name: Fida Field 0.9.28 AI Report Assistant

on:
  push:
    branches: [ fida-field-dev ]
    paths:
      - '.github/workflows/fida-field-0928-build.yml'
      - '.github/scripts/fida_field_0928_ai_report_assistant.py'
      - 'supabase/functions/ai-report-assistant/index.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify Supabase build configuration
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PUBLISHABLE_KEY:-}"
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) echo 'Supabase publishable key configured' ;;
            *) echo 'SUPABASE_PUBLISHABLE_KEY is missing or invalid' >&2; exit 1 ;;
          esac

      - name: Apply 0.9.28 AI report assistant
        run: python3 .github/scripts/fida_field_0928_ai_report_assistant.py

      - name: Verify source
        run: |
          grep -q 'canUseAiReportAssistant' fida-field/app/src/main/java/com/fidalix/fidafield/EntitlementManager.java
          grep -q 'aiReportDraft' fida-field/app/src/main/java/com/fidalix/fidafield/CloudSyncFoundation.java
          grep -q 'ai-report-assistant' fida-field/app/src/main/java/com/fidalix/fidafield/CloudSyncFoundation.java
          grep -q 'AI assist report' fida-field/app/src/main/java/com/fidalix/fidafield/MainActivity.java
          grep -q 'AI report suggestion' fida-field/app/src/main/java/com/fidalix/fidafield/MainActivity.java
          grep -q 'OPENAI_API_KEY' supabase/functions/ai-report-assistant/index.ts
          grep -q 'versionCode 31' fida-field/app/build.gradle
          grep -q "versionName '0.9.28-test'" fida-field/app/build.gradle

      - name: Reconstruct signing keystore
        run: |
          set -euo pipefail
          cat .fida-signing/fida-field-test.part* | tr -d '\n' | base64 -d > fida-field/app/fida-test.keystore
          echo 'd407757a25505be46048d30b3b19b85a4abb9b0bf14475b2368e0f2e7e9bac51  fida-field/app/fida-test.keystore' | sha256sum -c -

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install API 36
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1); fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Open APK
        working-directory: fida-field
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          gradle :app:assembleDebug -PFIDA_OPEN_EDITION=true --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Fida-Field-0.9.28-open-test.apk
          sha256sum /tmp/Fida-Field-0.9.28-open-test.apk

      - name: Enable release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fida-field/app/build.gradle')
          s=p.read_text()
          old='        release {\n            minifyEnabled false\n'
          new='        release {\n            signingConfig signingConfigs.test\n            minifyEnabled false\n'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY

      - name: Build Play AAB
        working-directory: fida-field
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          gradle :app:bundleRelease -PFIDA_OPEN_EDITION=false --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab /tmp/Fida-Field-0.9.28-play-release.aab
          jarsigner -verify /tmp/Fida-Field-0.9.28-play-release.aab
          sha256sum /tmp/Fida-Field-0.9.28-play-release.aab

      - name: Normalize source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fida-field/app/build.gradle')
          s=p.read_text().replace('        release {\n            signingConfig signingConfigs.test\n            minifyEnabled false\n','        release {\n            minifyEnabled false\n',1)
          p.write_text(s)
          PY
          rm -f fida-field/app/fida-test.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: Fida-Field-0.9.28-open-test-apk
          path: /tmp/Fida-Field-0.9.28-open-test.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: Fida-Field-0.9.28-play-release-aab
          path: /tmp/Fida-Field-0.9.28-play-release.aab
          retention-days: 14

      - name: Commit normalized source
        run: |
          set -euo pipefail
          git config user.name 'Fida Field CI'
          git config user.email 'actions@users.noreply.github.com'
          git add fida-field
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fida Field 0.9.28 AI report assistant'
          git fetch origin fida-field-dev
          git rebase origin/fida-field-dev
          git push origin HEAD:fida-field-dev
