name: Implement Fida Field 0.9.8

on:
  push:
    branches: [ fida-field-dev ]
    paths:
      - '.github/workflows/fida-field-098-apply.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout normalized source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add account and team domain classes
        shell: bash
        run: |
          set -euo pipefail
          JAVA=fida-field/app/src/main/java/com/fidalix/fidafield
          test -f "$JAVA/MainActivity.java"
          cat > "$JAVA/AccountTeamManager.java" <<'EOF'
          package com.fidalix.fidafield;

          import android.content.SharedPreferences;

          import java.util.UUID;

          /** Offline-first workspace/account state. Cloud authentication will replace local identity
           * claims once a backend is connected, while the local workspace remains usable offline. */
          public class AccountTeamManager {
              public static final String ROLE_OWNER="Owner";
              public static final String ROLE_ADMIN="Admin";
              public static final String ROLE_TECHNICIAN="Technician";
              public static final String ROLE_VIEWER="Viewer";

              public static final String KEY_WORKSPACE_ID="workspace_id";
              public static final String KEY_WORKSPACE_NAME="workspace_name";
              public static final String KEY_ACCOUNT_NAME="account_name";
              public static final String KEY_ACCOUNT_EMAIL="account_email";
              public static final String KEY_ACCOUNT_ROLE="account_role";

              private final SharedPreferences prefs;
              private final AppDatabase db;

              public AccountTeamManager(SharedPreferences prefs,AppDatabase db){this.prefs=prefs;this.db=db;}

              public boolean hasWorkspace(){return !workspaceId().isEmpty();}
              public String workspaceId(){return prefs.getString(KEY_WORKSPACE_ID,"");}
              public String workspaceName(){return prefs.getString(KEY_WORKSPACE_NAME,"");}
              public String accountName(){return prefs.getString(KEY_ACCOUNT_NAME,"");}
              public String accountEmail(){return prefs.getString(KEY_ACCOUNT_EMAIL,"");}
              public String accountRole(){return prefs.getString(KEY_ACCOUNT_ROLE,hasWorkspace()?ROLE_OWNER:"");}
              public boolean canManageTeam(){String r=accountRole();return ROLE_OWNER.equals(r)||ROLE_ADMIN.equals(r);}

              public void saveOwnerWorkspace(String workspaceName,String accountName,String email){
                  String id=workspaceId();if(id.isEmpty())id=UUID.randomUUID().toString();
                  prefs.edit().putString(KEY_WORKSPACE_ID,id).putString(KEY_WORKSPACE_NAME,clean(workspaceName))
                          .putString(KEY_ACCOUNT_NAME,clean(accountName)).putString(KEY_ACCOUNT_EMAIL,clean(email))
                          .putString(KEY_ACCOUNT_ROLE,ROLE_OWNER).apply();
                  db.ensureOwnerMember(id,clean(accountName),clean(email));
              }

              public int memberCount(){return hasWorkspace()?db.activeWorkspaceMemberCount(workspaceId()):0;}
              public int pendingInviteCount(){return hasWorkspace()?db.pendingWorkspaceInviteCount(workspaceId()):0;}
              public String teamSummary(){if(!hasWorkspace())return "Workspace not set up";int m=memberCount(),p=pendingInviteCount();return m+" member"+(m==1?"":"s")+(p>0?" • "+p+" pending":"");}
              private String clean(String s){return s==null?"":s.trim();}
          }
          EOF

          cat > "$JAVA/CloudBackend.java" <<'EOF'
          package com.fidalix.fidafield;

          /** Contract used by the offline sync engine. A concrete Supabase adapter is plugged into
           * this boundary once the project URL/key and database policies are provisioned. */
          public interface CloudBackend {
              String providerName();
              boolean isConfigured();
              boolean isSignedIn();
              String signedInEmail();
              void signOut();
              void sync(Callback callback);

              interface Callback { void onComplete(boolean success,String message); }
          }
          EOF

          cat > "$JAVA/CloudSyncFoundation.java" <<'EOF'
          package com.fidalix.fidafield;

          import android.content.SharedPreferences;

          import java.util.UUID;

          /** Offline-first synchronization state. Local changes are never discarded before a
           * backend acknowledges them. */
          public class CloudSyncFoundation {
              public static final String PROVIDER="Supabase";
              private final SharedPreferences prefs;
              private final AppDatabase db;

              public CloudSyncFoundation(SharedPreferences prefs,AppDatabase db){this.prefs=prefs;this.db=db;}

              public String deviceId(){String id=prefs.getString("cloud_device_id","");if(id==null||id.isEmpty()){id=UUID.randomUUID().toString();prefs.edit().putString("cloud_device_id",id).apply();}return id;}
              public long pendingChanges(){return db.count("sync_queue",null,null);}
              public String providerName(){return PROVIDER;}
              public boolean backendConfigured(){return !prefs.getString("supabase_url","").trim().isEmpty()&&!prefs.getString("supabase_anon_key","").trim().isEmpty();}
              public boolean signedIn(){return backendConfigured()&&!prefs.getString("cloud_access_token","").isEmpty();}
              public String accountEmail(){return prefs.getString("cloud_account_email","");}
              public String lastSync(){String v=prefs.getString("cloud_last_sync","");return v.isEmpty()?"Never":v;}
              public String lastResult(){return prefs.getString("cloud_last_result","Not connected");}
              public String backendStatus(){if(!backendConfigured())return "Not configured";return signedIn()?"Connected":"Configured · sign-in required";}
              public void markSyncResult(boolean ok,String when,String message){prefs.edit().putString("cloud_last_sync",when==null?"":when).putString("cloud_last_result",message==null?(ok?"Success":"Failed"):message).apply();}
          }
          EOF

      - name: Upgrade database for workspace and sync metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fida-field/app/src/main/java/com/fidalix/fidafield/AppDatabase.java')
          s=p.read_text()
          assert 'public static final int DB_VERSION = 3;' in s
          s=s.replace('public static final int DB_VERSION = 3;','public static final int DB_VERSION = 4;',1)
          anchor='        db.execSQL("CREATE TABLE sync_queue (id INTEGER PRIMARY KEY AUTOINCREMENT, entity_type TEXT NOT NULL, entity_id INTEGER NOT NULL, operation TEXT NOT NULL DEFAULT \'upsert\', changed_at TEXT NOT NULL, UNIQUE(entity_type,entity_id))");'
          assert anchor in s
          addition=anchor+'\n        db.execSQL("CREATE TABLE workspace_members (id INTEGER PRIMARY KEY AUTOINCREMENT, workspace_id TEXT NOT NULL, member_uuid TEXT NOT NULL UNIQUE, name TEXT NOT NULL, email TEXT, role TEXT NOT NULL DEFAULT \'Technician\', status TEXT NOT NULL DEFAULT \'Active\', created_at TEXT NOT NULL, updated_at TEXT NOT NULL)");\n        db.execSQL("CREATE TABLE workspace_invites (id INTEGER PRIMARY KEY AUTOINCREMENT, workspace_id TEXT NOT NULL, invite_uuid TEXT NOT NULL UNIQUE, email TEXT NOT NULL, role TEXT NOT NULL DEFAULT \'Technician\', status TEXT NOT NULL DEFAULT \'Pending\', created_at TEXT NOT NULL, updated_at TEXT NOT NULL)");\n        db.execSQL("CREATE TABLE sync_metadata (id INTEGER PRIMARY KEY AUTOINCREMENT, entity_type TEXT NOT NULL, entity_id INTEGER NOT NULL, remote_uuid TEXT NOT NULL UNIQUE, server_version INTEGER DEFAULT 0, last_synced_at TEXT, deleted_at TEXT, UNIQUE(entity_type,entity_id))");\n        db.execSQL("CREATE INDEX idx_workspace_members_workspace ON workspace_members(workspace_id,status)");\n        db.execSQL("CREATE INDEX idx_workspace_invites_workspace ON workspace_invites(workspace_id,status)");'
          s=s.replace(anchor,addition,1)
          up_anchor='        if(oldVersion<3){\n            db.execSQL("CREATE TABLE IF NOT EXISTS sync_queue (id INTEGER PRIMARY KEY AUTOINCREMENT, entity_type TEXT NOT NULL, entity_id INTEGER NOT NULL, operation TEXT NOT NULL DEFAULT \'upsert\', changed_at TEXT NOT NULL, UNIQUE(entity_type,entity_id))");\n            String stamp=now();\n            queueExistingForSync(db,"customer","customers",stamp);\n            queueExistingForSync(db,"site","sites",stamp);\n            queueExistingForSync(db,"asset","assets",stamp);\n            queueExistingForSync(db,"job","jobs",stamp);\n            queueExistingForSync(db,"technician","technicians",stamp);\n        }'
          assert up_anchor in s
          up_add=up_anchor+'\n        if(oldVersion<4){\n            db.execSQL("CREATE TABLE IF NOT EXISTS workspace_members (id INTEGER PRIMARY KEY AUTOINCREMENT, workspace_id TEXT NOT NULL, member_uuid TEXT NOT NULL UNIQUE, name TEXT NOT NULL, email TEXT, role TEXT NOT NULL DEFAULT \'Technician\', status TEXT NOT NULL DEFAULT \'Active\', created_at TEXT NOT NULL, updated_at TEXT NOT NULL)");\n            db.execSQL("CREATE TABLE IF NOT EXISTS workspace_invites (id INTEGER PRIMARY KEY AUTOINCREMENT, workspace_id TEXT NOT NULL, invite_uuid TEXT NOT NULL UNIQUE, email TEXT NOT NULL, role TEXT NOT NULL DEFAULT \'Technician\', status TEXT NOT NULL DEFAULT \'Pending\', created_at TEXT NOT NULL, updated_at TEXT NOT NULL)");\n            db.execSQL("CREATE TABLE IF NOT EXISTS sync_metadata (id INTEGER PRIMARY KEY AUTOINCREMENT, entity_type TEXT NOT NULL, entity_id INTEGER NOT NULL, remote_uuid TEXT NOT NULL UNIQUE, server_version INTEGER DEFAULT 0, last_synced_at TEXT, deleted_at TEXT, UNIQUE(entity_type,entity_id))");\n            db.execSQL("CREATE INDEX IF NOT EXISTS idx_workspace_members_workspace ON workspace_members(workspace_id,status)");\n            db.execSQL("CREATE INDEX IF NOT EXISTS idx_workspace_invites_workspace ON workspace_invites(workspace_id,status)");\n        }'
          s=s.replace(up_anchor,up_add,1)
          method_anchor='    public long count(String table, String where, String[] args) {'
          assert method_anchor in s
          methods=r'''    public void ensureOwnerMember(String workspaceId,String name,String email){
        if(workspaceId==null||workspaceId.isEmpty())return;Row existing=one("SELECT * FROM workspace_members WHERE workspace_id=? AND role='Owner' LIMIT 1",new String[]{workspaceId});
        ContentValues v=new ContentValues();v.put("workspace_id",workspaceId);v.put("name",name==null||name.trim().isEmpty()?"Workspace owner":name.trim());v.put("email",email==null?"":email.trim());v.put("role","Owner");v.put("status","Active");v.put("updated_at",now());
        long saved;if(existing.id()>0){saved=existing.id();getWritableDatabase().update("workspace_members",v,"id=?",new String[]{String.valueOf(saved)});}else{v.put("member_uuid",java.util.UUID.randomUUID().toString());v.put("created_at",now());saved=getWritableDatabase().insertOrThrow("workspace_members",null,v);}queueSync("workspace_member",saved,"upsert");
    }
    public List<Row> workspaceMembers(String workspaceId){return rows("SELECT * FROM workspace_members WHERE workspace_id=? ORDER BY CASE role WHEN 'Owner' THEN 0 WHEN 'Admin' THEN 1 WHEN 'Technician' THEN 2 ELSE 3 END,name COLLATE NOCASE",new String[]{workspaceId==null?"":workspaceId});}
    public Row getWorkspaceMember(long id){return one("SELECT * FROM workspace_members WHERE id=?",new String[]{String.valueOf(id)});}
    public long saveWorkspaceMember(long id,String workspaceId,String name,String email,String role,String status){ContentValues v=new ContentValues();v.put("workspace_id",workspaceId);v.put("name",name);v.put("email",email);v.put("role",role);v.put("status",status);v.put("updated_at",now());long saved=id;if(id==0){v.put("member_uuid",java.util.UUID.randomUUID().toString());v.put("created_at",now());saved=getWritableDatabase().insertOrThrow("workspace_members",null,v);}else getWritableDatabase().update("workspace_members",v,"id=?",new String[]{String.valueOf(id)});queueSync("workspace_member",saved,"upsert");return saved;}
    public int activeWorkspaceMemberCount(String workspaceId){return (int)count("workspace_members","workspace_id=? AND status='Active'",new String[]{workspaceId});}
    public List<Row> workspaceInvites(String workspaceId){return rows("SELECT * FROM workspace_invites WHERE workspace_id=? ORDER BY CASE status WHEN 'Pending' THEN 0 ELSE 1 END,created_at DESC",new String[]{workspaceId==null?"":workspaceId});}
    public int pendingWorkspaceInviteCount(String workspaceId){return (int)count("workspace_invites","workspace_id=? AND status='Pending'",new String[]{workspaceId});}
    public long saveWorkspaceInvite(String workspaceId,String email,String role){Row old=one("SELECT * FROM workspace_invites WHERE workspace_id=? AND email=? AND status='Pending' LIMIT 1",new String[]{workspaceId,email});ContentValues v=new ContentValues();v.put("workspace_id",workspaceId);v.put("email",email);v.put("role",role);v.put("status","Pending");v.put("updated_at",now());long saved=old.id();if(saved>0)getWritableDatabase().update("workspace_invites",v,"id=?",new String[]{String.valueOf(saved)});else{v.put("invite_uuid",java.util.UUID.randomUUID().toString());v.put("created_at",now());saved=getWritableDatabase().insertOrThrow("workspace_invites",null,v);}queueSync("workspace_invite",saved,"upsert");return saved;}
    public void cancelWorkspaceInvite(long id){ContentValues v=new ContentValues();v.put("status","Cancelled");v.put("updated_at",now());getWritableDatabase().update("workspace_invites",v,"id=?",new String[]{String.valueOf(id)});queueSync("workspace_invite",id,"upsert");}
    public String ensureRemoteUuid(String type,long entityId){Row r=one("SELECT remote_uuid FROM sync_metadata WHERE entity_type=? AND entity_id=?",new String[]{type,String.valueOf(entityId)});if(!r.s("remote_uuid").isEmpty())return r.s("remote_uuid");String uuid=java.util.UUID.randomUUID().toString();ContentValues v=new ContentValues();v.put("entity_type",type);v.put("entity_id",entityId);v.put("remote_uuid",uuid);getWritableDatabase().insertWithOnConflict("sync_metadata",null,v,SQLiteDatabase.CONFLICT_IGNORE);return one("SELECT remote_uuid FROM sync_metadata WHERE entity_type=? AND entity_id=?",new String[]{type,String.valueOf(entityId)}).s("remote_uuid");}
    public List<Row> pendingSyncRows(){return rows("SELECT q.*,m.remote_uuid,m.server_version,m.last_synced_at FROM sync_queue q LEFT JOIN sync_metadata m ON m.entity_type=q.entity_type AND m.entity_id=q.entity_id ORDER BY q.changed_at,q.id",null);}

'''
          s=s.replace(method_anchor,methods+method_anchor,1)
          p.write_text(s)
          PY

      - name: Add account, workspace and team screens
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fida-field/app/src/main/java/com/fidalix/fidafield/MainActivity.java')
          s=p.read_text()
          field='    private CloudSyncFoundation cloudSync;'
          assert field in s
          s=s.replace(field,field+'\n    private AccountTeamManager accountTeam;',1)
          init='        cloudSync.deviceId();'
          assert init in s
          s=s.replace(init,init+'\n        accountTeam=new AccountTeamManager(prefs,db);',1)

          old_more='''        b.addView(menuCard("Custom branding · Pro",entitlements.isPro()?(branding.isActive()?"Active custom company identity":"Logo, colors and branded PDFs"):"Subscriber feature · upgrade to unlock",v->{if(entitlements.canUseCustomBranding())showBranding();else showUpgradeRequired("Custom branding");}));
        b.addView(menuCard("Cloud & team sync",cloudSync.pendingChanges()+" local change(s) ready for future sync",v->showCloudSync()));
        b.addView(menuCard("Company settings","Brand, technician, report numbering and theme",v->showSettings()));
        b.addView(section("About"));b.addView(paragraph("Fida Field 0.9.7.1 Test\\nA polished, offline-first field service and maintenance manager by Fidalix."));'''
          new_more='''        b.addView(menuCard("Custom branding · Pro",entitlements.isPro()?(branding.isActive()?"Active custom company identity":"Logo, colors and branded PDFs"):"Subscriber feature · upgrade to unlock",v->{if(entitlements.canUseCustomBranding())showBranding();else showUpgradeRequired("Custom branding");}));
        b.addView(menuCard("Account & workspace",accountTeam.hasWorkspace()?accountTeam.workspaceName()+" • "+accountTeam.accountRole():"Set up owner profile and workspace",v->showAccountWorkspace()));
        b.addView(menuCard("Team members",accountTeam.teamSummary(),v->showTeam()));
        b.addView(menuCard("Cloud & team sync",cloudSync.backendStatus()+" • "+cloudSync.pendingChanges()+" pending",v->showCloudSync()));
        b.addView(menuCard("Company settings","Brand, technician, report numbering and theme",v->showSettings()));
        b.addView(section("About"));b.addView(paragraph("Fida Field 0.9.8 Test\\nAccount, workspace and team-ready offline field service by Fidalix."));'''
          assert old_more in s
          s=s.replace(old_more,new_more,1)

          cloud_start=s.index('    private void showCloudSync(){')
          cloud_end=s.index('    private void showUpgradeRequired(',cloud_start)
          new_methods=r'''    private void showAccountWorkspace(){
        setHeader("Account & Workspace","Identity, ownership & cloud readiness");clear();LinearLayout b=body(page());MaterialButton back=outlineButton("← Back");back.setOnClickListener(v->showMore());b.addView(back);
        b.addView(section("Workspace"));EditText workspace=input("Workspace / company name",accountTeam.workspaceName().isEmpty()?prefs.getString("company_name","Fidalix Limited"):accountTeam.workspaceName());EditText person=input("Your name",accountTeam.accountName().isEmpty()?prefs.getString("technician_name",""):accountTeam.accountName());EditText email=input("Account email",accountTeam.accountEmail().isEmpty()?prefs.getString("company_email",""):accountTeam.accountEmail());b.addView(workspace);b.addView(person);b.addView(email);
        MaterialButton save=button(accountTeam.hasWorkspace()?"Save workspace profile":"Create local workspace");save.setOnClickListener(v->{if(val(workspace).isEmpty()){workspace.setError("Workspace name required");return;}if(val(person).isEmpty()){person.setError("Your name required");return;}if(!val(email).isEmpty()&&!android.util.Patterns.EMAIL_ADDRESS.matcher(val(email)).matches()){email.setError("Enter a valid email");return;}accountTeam.saveOwnerWorkspace(val(workspace),val(person),val(email));toast("Workspace profile saved");showAccountWorkspace();});b.addView(save);
        if(accountTeam.hasWorkspace()){b.addView(section("Current identity"));b.addView(info("Workspace ID",accountTeam.workspaceId()));b.addView(info("Role",accountTeam.accountRole()));b.addView(info("Members",String.valueOf(accountTeam.memberCount())));b.addView(info("Pending invitations",String.valueOf(accountTeam.pendingInviteCount())));}
        b.addView(section("Cloud account"));b.addView(info("Provider",cloudSync.providerName()));b.addView(info("Backend",cloudSync.backendStatus()));b.addView(info("Signed-in account",cloudSync.accountEmail().isEmpty()?"Not connected":cloudSync.accountEmail()));b.addView(paragraph(cloudSync.backendConfigured()?"The backend is configured. Authentication controls will become active when the Supabase adapter is provisioned for this workspace.":"Your workspace is stored safely on this device and remains fully usable offline. Connect the suggested Supabase integration in ChatGPT so I can provision authentication, database tables and security policies for real multi-device sync."));MaterialButton sync=outlineButton("Cloud & sync status");sync.setOnClickListener(v->showCloudSync());b.addView(sync);
    }

    private void showTeam(){
        setHeader("Team","Workspace members & invitations");clear();LinearLayout b=body(page());MaterialButton back=outlineButton("← Back");back.setOnClickListener(v->showMore());b.addView(back);
        if(!accountTeam.hasWorkspace()){b.addView(empty("Create your workspace before adding team members."));MaterialButton setup=button("Set up workspace");setup.setOnClickListener(v->showAccountWorkspace());b.addView(setup);return;}
        b.addView(section(accountTeam.workspaceName()));b.addView(info("Your role",accountTeam.accountRole()));b.addView(info("Team",accountTeam.teamSummary()));
        if(accountTeam.canManageTeam()){MaterialButton invite=button("+ Invite member");invite.setOnClickListener(v->showInviteDialog());b.addView(invite);}else b.addView(paragraph("Only workspace Owners and Admins can manage members and invitations."));
        List<AppDatabase.Row> members=db.workspaceMembers(accountTeam.workspaceId());b.addView(section("Members ("+members.size()+")"));if(members.isEmpty())b.addView(empty("No members yet."));for(AppDatabase.Row r:members){String meta=(r.s("email").isEmpty()?"No email":r.s("email"))+" • "+r.s("status");MaterialCardView c=rowCard(r.s("name"),meta,r.s("role"));if(accountTeam.canManageTeam()&&!"Owner".equals(r.s("role")))c.setOnClickListener(v->showMemberDialog(r.id()));b.addView(c);}
        List<AppDatabase.Row> invites=db.workspaceInvites(accountTeam.workspaceId());b.addView(section("Invitations"));if(invites.isEmpty())b.addView(empty("No invitations queued."));for(AppDatabase.Row r:invites){MaterialCardView c=rowCard(r.s("email"),r.s("role"),r.s("status"));if(accountTeam.canManageTeam()&&"Pending".equals(r.s("status")))c.setOnClickListener(v->new MaterialAlertDialogBuilder(this).setTitle("Pending invitation").setMessage(r.s("email")+" · "+r.s("role")+"\n\nThe invitation will be sent after the cloud backend is connected.").setNegativeButton("Close",null).setPositiveButton("Cancel invitation",(d,w)->{db.cancelWorkspaceInvite(r.id());toast("Invitation cancelled");showTeam();}).show());b.addView(c);}
    }

    private void showInviteDialog(){
        if(!accountTeam.canManageTeam()){toast("Owner or Admin access required");return;}LinearLayout f=form();EditText email=input("Email address","");Spinner role=spinner(new String[]{AccountTeamManager.ROLE_ADMIN,AccountTeamManager.ROLE_TECHNICIAN,AccountTeamManager.ROLE_VIEWER});f.addView(email);f.addView(label("Role"));f.addView(role);AlertDialog d=new MaterialAlertDialogBuilder(this).setTitle("Invite team member").setView(scrollForm(f)).setNegativeButton("Cancel",null).setPositiveButton("Queue invitation",null).create();d.setOnShowListener(x->d.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v->{String e=val(email);if(e.isEmpty()||!android.util.Patterns.EMAIL_ADDRESS.matcher(e).matches()){email.setError("Valid email required");return;}db.saveWorkspaceInvite(accountTeam.workspaceId(),e,String.valueOf(role.getSelectedItem()));d.dismiss();toast(cloudSync.backendConfigured()?"Invitation queued for cloud delivery":"Invitation saved locally until cloud is connected");showTeam();}));d.show();
    }

    private void showMemberDialog(long id){
        AppDatabase.Row r=db.getWorkspaceMember(id);if(r.id()==0)return;if("Owner".equals(r.s("role"))){toast("The workspace owner cannot be changed here");return;}LinearLayout f=form();EditText name=input("Name",r.s("name"));EditText email=input("Email",r.s("email"));Spinner role=spinner(new String[]{AccountTeamManager.ROLE_ADMIN,AccountTeamManager.ROLE_TECHNICIAN,AccountTeamManager.ROLE_VIEWER});setSpinner(role,r.s("role"));Spinner status=spinner(new String[]{"Active","Inactive"});setSpinner(status,r.s("status"));f.addView(name);f.addView(email);f.addView(label("Role"));f.addView(role);f.addView(label("Status"));f.addView(status);AlertDialog d=new MaterialAlertDialogBuilder(this).setTitle("Edit member").setView(scrollForm(f)).setNegativeButton("Cancel",null).setPositiveButton("Save",null).create();d.setOnShowListener(x->d.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v->{if(val(name).isEmpty()){name.setError("Name required");return;}db.saveWorkspaceMember(id,accountTeam.workspaceId(),val(name),val(email),String.valueOf(role.getSelectedItem()),String.valueOf(status.getSelectedItem()));d.dismiss();toast("Member updated");showTeam();}));d.show();
    }

    private void showCloudSync(){
        setHeader("Cloud & Team Sync","Offline-first sync status");clear();LinearLayout b=body(page());MaterialButton back=outlineButton("← Back");back.setOnClickListener(v->showMore());b.addView(back);
        b.addView(section("Workspace"));b.addView(info("Workspace",accountTeam.hasWorkspace()?accountTeam.workspaceName():"Not set up"));b.addView(info("Role",accountTeam.accountRole().isEmpty()?"Local user":accountTeam.accountRole()));b.addView(info("Team",accountTeam.teamSummary()));
        b.addView(section("Cloud backend"));b.addView(info("Provider",cloudSync.providerName()));b.addView(info("Status",cloudSync.backendStatus()));b.addView(info("Account",cloudSync.accountEmail().isEmpty()?"Not signed in":cloudSync.accountEmail()));b.addView(info("Last sync",cloudSync.lastSync()));b.addView(info("Last result",cloudSync.lastResult()));
        b.addView(section("This device"));b.addView(info("Device ID",cloudSync.deviceId()));b.addView(info("Pending local changes",String.valueOf(cloudSync.pendingChanges())));b.addView(paragraph("Local changes stay queued until the server acknowledges them. This preserves field work during outages and prevents a failed sync from deleting unsent data."));
        MaterialButton sync=button("Sync now");sync.setEnabled(cloudSync.backendConfigured()&&cloudSync.signedIn());sync.setOnClickListener(v->toast("Backend adapter provisioning is the next cloud activation step."));b.addView(sync);if(!cloudSync.backendConfigured())b.addView(paragraph("Backend configuration is not installed yet. Connect the Supabase integration in ChatGPT and I can provision the project schema, authentication and row-level security, then wire real sign-in and multi-device synchronization into this screen."));
        MaterialButton copy=outlineButton("Copy device ID");copy.setOnClickListener(v->{android.content.ClipboardManager cm=(android.content.ClipboardManager)getSystemService(CLIPBOARD_SERVICE);cm.setPrimaryClip(android.content.ClipData.newPlainText("Fida Field device ID",cloudSync.deviceId()));toast("Device ID copied");});b.addView(copy);
    }

'''
          s=s[:cloud_start]+new_methods+s[cloud_end:]
          p.write_text(s)
          PY

      - name: Bump Fida Field to 0.9.8
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fida-field/app/build.gradle');s=p.read_text();assert 'versionCode 9' in s and "versionName '0.9.7.1-test'" in s;s=s.replace('versionCode 9','versionCode 10',1).replace("versionName '0.9.7.1-test'","versionName '0.9.8-test'",1);p.write_text(s)
          r=Path('fida-field/README.md');s=r.read_text();s=s.replace('0.9.7.1-test','0.9.8-test').replace('versionCode 9','versionCode 10');r.write_text(s)
          PY
          grep -q 'DB_VERSION = 4' fida-field/app/src/main/java/com/fidalix/fidafield/AppDatabase.java
          grep -q 'Account & workspace' fida-field/app/src/main/java/com/fidalix/fidafield/MainActivity.java
          grep -q "versionName '0.9.8-test'" fida-field/app/build.gradle

      - name: Reconstruct persistent test signing key
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-signing/fida-field-test.part* | tr -d '\n' | base64 -d > fida-field/app/fida-test.keystore
          echo 'd407757a25505be46048d30b3b19b85a4abb9b0bf14475b2368e0f2e7e9bac51  fida-field/app/fida-test.keystore' | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1); fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile 0.9.8
        working-directory: fida-field
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload 0.9.8 APK
        uses: actions/upload-artifact@v4
        with:
          name: Fida-Field-0.9.8-test-apk
          path: fida-field/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Commit compiled 0.9.8 normal source
        shell: bash
        run: |
          set -euo pipefail
          rm -f fida-field/app/fida-test.keystore
          git config user.name 'Fida Field CI'
          git config user.email 'actions@users.noreply.github.com'
          git add fida-field
          git commit -m 'Fida Field 0.9.8 account workspace and team foundation'
          git push origin HEAD:fida-field-dev
