name: Fida Field 0.9.11 Sync Reliability

on:
  push:
    branches: [ fida-field-dev ]
    paths:
      - '.github/workflows/fida-field-0911.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fida-field-0911-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout normalized 0.9.10 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.9.11 sync reliability migration
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n' < .fida-build/apply_0911.py.gz.b64 | base64 -d > /tmp/apply_0911.py.gz
          echo '94f23173d41447e96d0cb5a4f5751b23627fd866ceaf29350887f5272a0d3be6  /tmp/apply_0911.py.gz' | sha256sum -c -
          gzip -dc /tmp/apply_0911.py.gz > .fida-build/apply_0911.py
          echo '9048e5e02fd04499908c499f68ead71af9914bd47f7a43cb298b36a21f5332dc  .fida-build/apply_0911.py' | sha256sum -c -
          python3 .fida-build/apply_0911.py
          grep -q 'DB_VERSION = 7' fida-field/app/src/main/java/com/fidalix/fidafield/AppDatabase.java
          grep -q "versionName '0.9.11-test'" fida-field/app/build.gradle
          grep -q 'class CloudSyncWorker' fida-field/app/src/main/java/com/fidalix/fidafield/CloudSyncWorker.java
          grep -q 'Cloud deletion deferred' fida-field/app/src/main/java/com/fidalix/fidafield/AppDatabase.java
          grep -q 'Automatic cloud sync' fida-field/app/src/main/java/com/fidalix/fidafield/MainActivity.java

      - name: Verify Supabase build configuration
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PUBLISHABLE_KEY:-}"
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) echo 'Supabase publishable key is configured' ;;
            *) echo 'SUPABASE_PUBLISHABLE_KEY is missing or has the wrong key type' >&2; exit 1 ;;
          esac

      - name: Reconstruct persistent test signing key
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-signing/fida-field-test.part* | tr -d '\n' | base64 -d > fida-field/app/fida-test.keystore
          echo 'd407757a25505be46048d30b3b19b85a4abb9b0bf14475b2368e0f2e7e9bac51  fida-field/app/fida-test.keystore' | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1); fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build signed 0.9.11 APK
        working-directory: fida-field
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload 0.9.11 APK
        uses: actions/upload-artifact@v4
        with:
          name: Fida-Field-0.9.11-test-apk
          path: fida-field/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Commit normalized 0.9.11 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f fida-field/app/fida-test.keystore .fida-build/apply_0911.py .fida-build/apply_0911.py.gz.b64
          git config user.name 'Fida Field CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A fida-field .fida-build/apply_0911.py.gz.b64
          git commit -m 'Fida Field 0.9.11 sync reliability and conflict protection'
          git push origin HEAD:fida-field-dev
