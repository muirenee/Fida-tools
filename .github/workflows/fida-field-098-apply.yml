name: Fida Field 0.9.8 Transform Extract

on:
  push:
    branches: [ fida-field-dev ]
    paths:
      - '.github/workflows/fida-field-098-apply.yml'
      - '.fida-dev/0.9.8-script.part*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current transform script
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-dev/0.9.8-script.part* | tr -d '\n' | base64 -d > /tmp/fida-098-transform.py
          cp /tmp/fida-098-transform.py fida-098-transform.py
          wc -c fida-098-transform.py
      - name: Upload transform snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fida-098-transform-snapshot
          path: fida-098-transform.py
          retention-days: 2
