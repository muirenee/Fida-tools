name: Fida Field 0.9.8.1 Branding Hotfix

on:
  push:
    branches: [ fida-field-dev ]
    paths:
      - '.github/workflows/fida-field-0981-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fida-field-0981-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout normalized 0.9.8 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply branding activation hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          java = Path('fida-field/app/src/main/java/com/fidalix/fidafield/MainActivity.java')
          s = java.read_text()
          old = 'branding.save(enabled.isChecked(),val(primary),val(accent),val(highlight));refreshEntitlementsAndBranding();toast(enabled.isChecked()?"Custom branding applied":"Custom branding saved but disabled");recreate();'
          new = 'enabled.setChecked(true);branding.save(true,val(primary),val(accent),val(highlight));refreshEntitlementsAndBranding();toast("Custom branding applied");recreate();'
          assert old in s, '0.9.8 branding save handler not found'
          s = s.replace(old, new, 1)
          s = s.replace('Fida Field 0.9.8 Test\\nAccount, workspace and team-ready offline field service by Fidalix.', 'Fida Field 0.9.8.1 Test\\nAccount, workspace and team-ready offline field service by Fidalix.', 1)
          java.write_text(s)

          gradle = Path('fida-field/app/build.gradle')
          g = gradle.read_text()
          assert 'versionCode 10' in g and "versionName '0.9.8-test'" in g, '0.9.8 version markers not found'
          g = g.replace('versionCode 10', 'versionCode 11', 1)
          g = g.replace("versionName '0.9.8-test'", "versionName '0.9.8.1-test'", 1)
          gradle.write_text(g)

          readme = Path('fida-field/README.md')
          if readme.exists():
              r = readme.read_text().replace('0.9.8-test','0.9.8.1-test').replace('versionCode 10','versionCode 11')
              readme.write_text(r)
          PY
          grep -q 'branding.save(true' fida-field/app/src/main/java/com/fidalix/fidafield/MainActivity.java
          grep -q "versionName '0.9.8.1-test'" fida-field/app/build.gradle

      - name: Reconstruct persistent test signing key
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-signing/fida-field-test.part* | tr -d '\n' | base64 -d > fida-field/app/fida-test.keystore
          echo 'd407757a25505be46048d30b3b19b85a4abb9b0bf14475b2368e0f2e7e9bac51  fida-field/app/fida-test.keystore' | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1); fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build signed 0.9.8.1 APK
        working-directory: fida-field
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload 0.9.8.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Fida-Field-0.9.8.1-test-apk
          path: fida-field/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Commit normalized hotfix source
        shell: bash
        run: |
          set -euo pipefail
          rm -f fida-field/app/fida-test.keystore
          git config user.name 'Fida Field CI'
          git config user.email 'actions@users.noreply.github.com'
          git add fida-field
          git commit -m 'Fida Field 0.9.8.1 apply custom branding on save'
          git push origin HEAD:fida-field-dev
