name: Fida Field Test Build

on:
  push:
    branches: [ fida-field-dev ]
    paths:
      - '.fida-build/**'
      - '.fida-patches/**'
      - '.github/workflows/fida-field-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fida-field-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Fida Field source
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-build/part*.b64 | tr -d '\n' | base64 -d > fida-field-project.zip
          unzip -q fida-field-project.zip
          test -f fida-field/app/build.gradle

      - name: Apply Fida Field 0.9.1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fida-patches/0.9.1.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/fida-0.9.1.patch
          patch -p1 < /tmp/fida-0.9.1.patch
          grep -q "versionName '0.9.1-test'" fida-field/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build installable test APK
        working-directory: fida-field
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fida-Field-0.9.1-test-apk
          path: fida-field/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
